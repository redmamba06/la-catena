# Solo le impostazioni che La Catena usa sul progetto remoto (niente sviluppo locale).
project_id = "la-catena"

[auth]
site_url = "https://redmamba06.github.io/la-catena/"
additional_redirect_urls = ["https://redmamba06.github.io/la-catena/"]
minimum_password_length = 8
# account unico già creato: niente nuove registrazioni
enable_signup = false

[auth.email]
# deve restare true: qui significa "accesso con email attivo", non "nuove registrazioni"
enable_signup = true
enable_confirmations = false

[functions.notify]
verify_jwt = false
