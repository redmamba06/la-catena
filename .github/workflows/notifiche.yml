# Manda al telefono le notifiche delle 8 e delle 20 (ora italiana).
# Gli orari cron sono in UTC: due righe per fascia coprono ora solare e ora legale,
# lo script tiene solo quella che corrisponde davvero alle 8 o alle 20 a Roma.
name: Notifiche

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch:
    inputs:
      kind:
        description: "Quale notifica mandare (morning o evening)"
        default: "evening"

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock web-push@3.6.7
      - run: node .github/scripts/notifica.mjs
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          SCHEDULE: ${{ github.event.schedule }}
          KIND: ${{ github.event.inputs.kind }}
